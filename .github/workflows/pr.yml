name: PR Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            bun: false
            commands: yarn run check-types && yarn run check-types:tui && yarn run lint
          - name: unit
            bun: false
            commands: yarn run test:unit
          - name: dom
            bun: false
            commands: yarn run test:dom
          - name: tui
            bun: true
            commands: yarn run test:tui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with:
          bun-version: latest

      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: ${{ matrix.commands }}
