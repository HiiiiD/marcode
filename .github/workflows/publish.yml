name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Name must match the federated credential's subject in the Entra app
    # registration (e.g. repo:OWNER/REPO:environment:marketplace-publish).
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: yarn install --frozen-lockfile

      - run: yarn run check-types
      - run: yarn run lint
      - run: yarn run test:unit
      - run: yarn run test:dom

      # Entra ID workload identity federation — no PAT, no stored secret.
      # Azure DevOps retires global PATs on 2026-12-01.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - run: npx @vscode/vsce publish --azure-credential
