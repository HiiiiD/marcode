version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    ignore:
      # @opentui/core pins 0.25.10 and imports tree-sitter.wasm, renamed in 0.27
      - dependency-name: "web-tree-sitter"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
      provider-claude:
        patterns:
          - "@anthropic-ai/*"
      provider-opencode:
        patterns:
          - "@opencode-ai/*"
      provider-acp:
        patterns:
          - "@agentclientprotocol/*"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
      opentui:
        patterns:
          - "@opentui/*"
          - "react-devtools-core"
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
